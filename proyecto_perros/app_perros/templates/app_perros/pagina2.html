{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página 2</title>
  <!-- Estilos internos -->
  <style>
    /* Establece el fondo y estilo global */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    /* Contenedor principal que centra el contenido */
    .container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 650px; /* Tamaño fijo de 650px */
      height: 550px; /* Tamaño fijo de 550px */
      position: relative;
    }

    h1 {
      font-size: 36px; /* Tamaño de la fuente */
      color: #333; /* Color del texto */
      text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3); /* Sombreado */
    }

    /* Estilo del botón */
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 20px;
      position: absolute;
      bottom: 20px; /* Distancia desde la parte inferior */
      right: 20px; /* Distancia desde la parte derecha */
    }

    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Página 2</h1>
    <!-- Aquí puedes agregar el contenido de la página 2 -->
    <p>parrafo pagina 2</p>
    <!-- Botón de continuación -->
    <a href="pagina3.html" class="btn btn-primary">Continuar</a>
  </div>
</body>
</html>
